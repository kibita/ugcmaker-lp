<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="ABテスト用の動画を大量に">
  <!-- background -->
  <path d="M12 150 C 40 120, 90 168, 130 148 C 170 128, 210 158, 230 138 L 230 180 L 12 180 Z" fill="#D2E3FC"/>
  <ellipse cx="120" cy="150" rx="104" ry="20" fill="#AECBFA" opacity="0.55"/>
  <circle cx="40" cy="120" r="9" fill="#FDE293"/>
  <circle cx="206" cy="44" r="11" fill="#E8F0FE"/>

  <!-- stacked frames behind (volume) -->
  <rect x="44" y="50" width="60" height="58" rx="9" fill="#AECBFA"/>
  <rect x="50" y="56" width="60" height="58" rx="9" fill="#C3D6F9"/>

  <!-- Card A -->
  <rect x="56" y="62" width="62" height="56" rx="9" fill="#4285F4"/>
  <path d="M80 78 L96 88 L80 98 Z" fill="#FFFFFF"/>
  <g transform="translate(66 72)"><circle r="9" fill="#FFFFFF"/><text x="0" y="3.6" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="11" font-weight="900" fill="#1967D2">A</text></g>

  <!-- Card B (winner) -->
  <rect x="132" y="62" width="62" height="56" rx="9" fill="#1967D2"/>
  <path d="M156 78 L172 88 L156 98 Z" fill="#FFFFFF"/>
  <g transform="translate(142 72)"><circle r="9" fill="#FFFFFF"/><text x="0" y="3.6" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="11" font-weight="900" fill="#1967D2">B</text></g>

  <!-- winner check -->
  <g transform="translate(186 110)">
    <circle r="15" fill="#34A853"/>
    <path d="M-6 0 L-1.5 4.5 L6.5 -4" stroke="#FFFFFF" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
