<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="広告制作を内製化したい">
  <!-- background -->
  <path d="M12 150 C 40 120, 90 168, 130 148 C 170 128, 210 158, 230 138 L 230 180 L 12 180 Z" fill="#D2E3FC"/>
  <ellipse cx="120" cy="150" rx="104" ry="20" fill="#AECBFA" opacity="0.55"/>
  <circle cx="44" cy="46" r="12" fill="#E8F0FE"/>
  <circle cx="206" cy="118" r="8" fill="#FDE293"/>

  <!-- office building -->
  <rect x="58" y="52" width="80" height="98" rx="7" fill="#4285F4"/>
  <!-- windows -->
  <g fill="#E8F0FE">
    <rect x="68" y="64" width="18" height="16" rx="3"/>
    <rect x="96" y="64" width="18" height="16" rx="3"/>
    <rect x="68" y="88" width="18" height="16" rx="3"/>
    <rect x="96" y="88" width="18" height="16" rx="3"/>
  </g>
  <!-- door -->
  <rect x="82" y="116" width="32" height="34" rx="4" fill="#1967D2"/>
  <circle cx="107" cy="134" r="2.4" fill="#FBBC04"/>

  <!-- gear (cog) -->
  <g transform="translate(150 66)">
    <rect x="-16" y="-16" width="32" height="32" rx="8" fill="#FBBC04"/>
    <rect x="-16" y="-16" width="32" height="32" rx="8" fill="#FBBC04" transform="rotate(45)"/>
    <circle r="9" fill="#E8F0FE"/>
  </g>

  <!-- small person (team) -->
  <g transform="translate(176 120)">
    <circle cx="0" cy="-12" r="7" fill="#1967D2"/>
    <path d="M-11 14 C -11 -1, 11 -1, 11 14 Z" fill="#1967D2"/>
  </g>
</svg>
